<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050507">
<title>World Sims Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Bangers&display=swap">
<style>
/* Layout: the app itself, full height, like the real product on a phone.
   On wide screens it sits as a column over a blurred backdrop of the
   current character; the creator panel docks on the right. */
:root{
  color-scheme:dark;
  --page:#050507;
  --ink:#050507;
  --card:#121216;
  --card-2:#1b1b21;
  --green:#4ade80;
  --green-dk:#16361f;
  --red:#ff5a5f;
  --blue:#0a84ff;
  --coin:#3b6cf6;
  --text:#ffffff;
  --muted:rgba(255,255,255,.6);
  --line:rgba(255,255,255,.10);
  --panel:#111116;
  --panel-2:#1a1a21;
  --top:max(14px, env(safe-area-inset-top, 0px));
  --bot:env(safe-area-inset-bottom, 0px);
  --ui:"Poppins",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.shell{display:flex;height:100%;width:100%}
.stagewrap{flex:1 1 auto;min-width:0;position:relative;display:flex;justify-content:center;overflow:hidden;background:var(--page)}
.backdrop{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.1) brightness(.4);transform:scale(1.1)}
.app{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:var(--ink);box-shadow:0 0 80px rgba(0,0,0,.6)}
@media (max-width:520px){.backdrop{display:none}.app{max-width:none;box-shadow:none}}
.screen{position:absolute;inset:0;overflow:hidden}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.bgup{position:absolute;inset:0}

/* optional fake status bar, for screen recordings on desktop */
.sb{position:absolute;top:0;left:0;right:0;height:50px;z-index:40;display:none;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font:600 17px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;letter-spacing:-.02em;color:#fff}
.with-sb .sb{display:flex}
.with-sb{--top:50px}
.sb .icons{display:flex;align-items:center;gap:6px}
.sb .batt{display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:13px;padding:0 3px;border-radius:4px;background:#fff;color:#000;font-size:11px;font-weight:700}

/* ---------- brand ---------- */
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo .gl{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#4ade80,#3b6cf6)}
.logo.sm{font-size:13px;gap:6px}.logo.sm .gl{width:20px;height:20px;border-radius:6px}
.coins{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:20px;background:rgba(20,20,26,.78);border:1px solid var(--line);backdrop-filter:blur(12px);font-weight:600;font-size:17px}
.coin{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#7aa0ff,var(--coin) 60%,#2a4fc4)}
.circ{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(20,20,26,.78);border:1px solid var(--line);backdrop-filter:blur(12px);cursor:pointer;flex:none;position:relative}
.circ .red{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #15151b}
.ic{display:block}

/* ---------- nav ---------- */
.nav{position:absolute;left:14px;right:14px;bottom:calc(14px + var(--bot));height:70px;border-radius:24px;background:rgba(24,24,30,.86);backdrop-filter:blur(18px);border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:6px;z-index:5}
.nav button{border:0;background:none;height:100%;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;cursor:pointer}
.nav button.on{background:rgba(255,255,255,.07);color:var(--green)}

/* ---------- feed (For You) ---------- */
.feed .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 70%,#000 100%)}
.topbar{position:absolute;top:var(--top);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:3}
.toptabs{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:600;color:var(--muted)}
.toptabs .on{color:#fff;position:relative}
.toptabs .on::after{content:"";position:absolute;left:50%;bottom:-8px;width:20px;height:3px;border-radius:2px;background:#fff;transform:translateX(-50%)}
.toptabs i{width:1px;height:18px;background:rgba(255,255,255,.3)}
.topright{display:flex;gap:8px;align-items:center}
.fstack{position:absolute;left:16px;right:16px;bottom:calc(100px + var(--bot));z-index:2}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:15px;background:rgba(0,0,0,.5);border:1px solid var(--line);font-size:13px;font-weight:600;backdrop-filter:blur(10px)}
.cont{margin:14px 0 4px;font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--green);display:flex;align-items:center;gap:8px}
.cont::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(74,222,128,.25)}
.simt{font-size:30px;line-height:1.12;font-weight:700;margin:0;letter-spacing:-.01em;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.scene{margin:6px 0 0;font-size:15px;color:rgba(255,255,255,.82)}
.cast{display:flex;align-items:center;margin-top:12px}
.cast span{width:30px;height:30px;border-radius:50%;border:2px solid #000;margin-right:-8px;background-size:cover;background-position:center}
.cast small{margin-left:16px;font-size:13px;font-weight:600;color:var(--muted)}
.replycard{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 12px;border-radius:20px;background:rgba(18,18,22,.86);border:1px solid var(--line);backdrop-filter:blur(14px);cursor:pointer}
.av{width:48px;height:48px;border-radius:50%;flex:none;background-size:cover;background-position:center;position:relative}
.av .bub{position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--green);border:2px solid #111;display:grid;place-items:center}
.replycard .tx{flex:1;min-width:0}
.replycard b{display:block;font-size:15px;font-weight:600}
.replycard .msg{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbtn{height:40px;padding:0 18px;border-radius:20px;border:0;background:rgba(255,255,255,.1);font-weight:600;font-size:15px;cursor:pointer;flex:none}
.bomb{display:block;margin:0 0 14px;transform:rotate(-2deg);transform-origin:left center;animation:thump 1.6s ease-in-out infinite}
.bomb .tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:8px 8px 0 0;background:#fff;color:#e11d48;font-size:12.5px;font-weight:700;letter-spacing:.14em}
.bomb .tag i{width:8px;height:8px;border-radius:50%;background:#e11d48;animation:blink 1s infinite}
.bomb .hl{display:block;padding:10px 14px;border-radius:0 14px 14px 14px;background:linear-gradient(100deg,#e11d48,#f43f5e 55%,#fb7185);font-size:23px;line-height:1.2;font-weight:700;box-shadow:0 10px 40px rgba(225,29,72,.55)}
@keyframes thump{0%,100%{transform:rotate(-2deg) scale(1)}8%{transform:rotate(-2deg) scale(1.04)}16%{transform:rotate(-2deg) scale(1)}}
@keyframes blink{50%{opacity:.25}}
.live{display:inline-flex;align-items:center;gap:7px;margin-left:6px}
.live i{width:8px;height:8px;border-radius:50%;background:#ff3b30;animation:blink 1s infinite}
.drop{position:absolute;top:calc(var(--top) + 58px);left:12px;right:12px;z-index:4;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;background:rgba(36,36,44,.72);backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.45);cursor:pointer;animation:dropin 5.5s ease-in-out 1.2s both}
.drop .av{width:42px;height:42px}
.drop .tx{flex:1;min-width:0}
.drop .top{display:flex;justify-content:space-between;font-size:14.5px}
.drop .top span{font-size:12.5px;color:var(--muted)}
.drop .body{font-size:14.5px;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes dropin{0%{opacity:0;transform:translateY(-120%)}8%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-120%)}}
.dots{position:absolute;left:0;right:0;bottom:calc(92px + var(--bot));display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.dots i.on{width:22px;background:#fff}

/* ---------- messages list ---------- */
.list{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--top) + 4px) 16px calc(110px + var(--bot))}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.list h1{font-size:30px;font-weight:700;margin:14px 0 14px}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row .tx{flex:1;min-width:0}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .name{font-weight:600;font-size:16px}
.row .time{font-size:12.5px;color:var(--muted)}
.row .simn{font-size:12.5px;color:var(--green);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .last{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .last.new{color:#fff;font-weight:500}
.row .n{position:absolute;top:-4px;right:-4px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--red);font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--ink)}
.row .av{width:56px;height:56px}

/* ---------- chat ---------- */
.chat .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.72) 32%,rgba(0,0,0,.9))}
.chat .bgup .media{filter:blur(2px) brightness(.85);transform:scale(1.03)}
.chead{position:absolute;top:var(--top);left:14px;right:14px;display:flex;align-items:center;gap:10px;z-index:3}
.chead .t{flex:1;min-width:0;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .coins{height:38px;font-size:16px}
.chead .coin{width:24px;height:24px}
.castrow{position:absolute;top:calc(var(--top) + 56px);left:0;right:0;display:flex;justify-content:space-around;padding:0 8px;z-index:3}
.castrow > div{display:flex;flex-direction:column;align-items:center;gap:5px;width:84px;cursor:pointer}
.castrow .av{width:58px;height:58px;outline:3px solid transparent;outline-offset:3px}
.castrow .on .av{outline-color:var(--green)}
.castrow .av .bub{width:22px;height:22px}
.castrow .cnt{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--red);font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid #111}
.castrow small{font-size:13px;color:var(--muted);max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castrow .on small{color:#fff}
.statbar{position:absolute;top:calc(var(--top) + 150px);left:14px;right:14px;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:22px;background:rgba(16,16,20,.82);border:1px solid var(--line);backdrop-filter:blur(14px);z-index:3}
.ring{position:relative;width:46px;height:46px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.statbar .tx{flex:1;min-width:0;line-height:1.25}
.statbar small{display:block;font-size:12.5px;color:var(--muted)}
.statbar .lv{font-size:15px;font-weight:600}
.mood{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:rgba(255,255,255,.06);flex:none}
.msgs{position:absolute;top:calc(var(--top) + 222px);left:0;right:0;bottom:calc(136px + var(--bot));overflow-y:auto;padding:6px 14px 10px;display:flex;flex-direction:column;gap:8px;z-index:2;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msgs .sp{flex:1}
.b{max-width:80%;padding:12px 16px;border-radius:22px;font-size:16px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}
.b.them{align-self:flex-start;background:rgba(44,44,52,.92);border-bottom-left-radius:8px}
.b.me{align-self:flex-end;background:var(--blue);border-bottom-right-radius:8px}
.pill{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:18px;font-size:14.5px;font-weight:600;border:1px solid}
.pill.up{background:rgba(22,54,31,.92);border-color:rgba(74,222,128,.45);color:var(--green)}
.pill.down{background:rgba(60,18,22,.92);border-color:rgba(255,90,95,.45);color:var(--red)}
.narr{align-self:center;max-width:88%;text-align:center;font-size:14px;font-style:italic;color:rgba(255,255,255,.72);line-height:1.4}
.date{align-self:center;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin:4px 0}
.typing{align-self:flex-start;background:rgba(44,44,52,.92);border-radius:22px;border-bottom-left-radius:8px;padding:15px 16px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.65);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{position:absolute;left:14px;right:14px;bottom:calc(78px + var(--bot));display:grid;grid-template-columns:1fr 1fr;gap:8px;z-index:3}
.chips button{height:46px;padding:0 14px;border-radius:23px;border:1px solid var(--line);background:rgba(18,18,22,.9);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left}
.composer{position:absolute;left:14px;right:14px;bottom:calc(14px + var(--bot));display:flex;gap:8px;align-items:center;z-index:3}
.composer .act{width:54px;height:54px;border-radius:27px;border:1px solid rgba(74,222,128,.4);background:var(--green-dk);color:var(--green);display:grid;place-items:center;cursor:pointer;flex:none}
.composer .box{flex:1;min-width:0;display:flex;align-items:center;height:54px;border-radius:27px;background:rgba(18,18,22,.92);border:1px solid var(--line);padding:0 6px 0 18px}
.composer input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:16px}
.composer input::placeholder{color:var(--muted)}
.composer .send{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer}

/* ---------- action: simulating your world ---------- */
.action{background:#07080b}
.action .bgup .media{filter:blur(18px) brightness(.45) saturate(1.2);transform:scale(1.2)}
.action .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.4px);background-size:7px 7px;mix-blend-mode:screen}
.yact{position:absolute;top:calc(var(--top) + 40px);left:20px;right:20px;text-align:center;z-index:2}
.yact small{font-size:13px;letter-spacing:.3em;color:var(--muted)}
.yact div{margin-top:12px;padding:16px 20px;border-radius:26px;background:rgba(18,18,22,.82);border:1px solid var(--line);font-size:17px;font-weight:500;line-height:1.35}
.orbit{position:absolute;left:50%;top:44%;width:230px;height:230px;transform:translate(-50%,-50%);z-index:2}
.orbit .track{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.04) 1px,transparent 1.5px) 0 0/8px 8px,rgba(0,0,0,.35);border:12px solid rgba(255,255,255,.06)}
.orbit svg{position:absolute;inset:0;transform:rotate(-90deg)}
.orbit svg circle.p{stroke-dasharray:666;stroke-dashoffset:666;animation:fill 3.2s ease-in-out forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.orbit .center{position:absolute;left:50%;top:50%;width:110px;height:130px;transform:translate(-50%,-50%);border-radius:18px;background-size:cover;background-position:center;box-shadow:0 10px 40px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.15)}
.orbit .spin{position:absolute;inset:-26px;animation:spin 9s linear infinite}
.orbit .spin span{position:absolute;width:54px;height:54px;border-radius:50%;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,.5);box-shadow:0 6px 20px rgba(0,0,0,.5);animation:spin 9s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.simtxt{position:absolute;left:20px;right:20px;bottom:calc(170px + var(--bot));text-align:center;z-index:2}
.simtxt h2{margin:0;font-size:31px;font-weight:700;letter-spacing:.02em}
.simtxt p{margin:12px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:15px}
.simtxt .cast span{width:26px;height:26px}
.tip{position:absolute;left:16px;right:16px;bottom:calc(46px + var(--bot));display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:rgba(18,18,22,.85);border:1px solid var(--line);z-index:2}
.tip .bulb{width:46px;height:46px;border-radius:14px;background:#2a2410;display:grid;place-items:center;flex:none}
.tip small{display:block;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.tip div{font-size:15px;line-height:1.35}
.result{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px calc(24px + var(--bot));background:rgba(0,0,0,.35);animation:rin .45s ease-out}
@keyframes rin{from{opacity:0;transform:translateY(20px)}}
.rcard{border-radius:28px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.7)}
.rcard .img{position:relative;height:300px}
.rcard .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,var(--card))}
.rcard .in{padding:4px 20px 20px}
.rcard small{font-size:12.5px;letter-spacing:.24em;color:var(--green);font-weight:600}
.rcard h3{margin:8px 0 12px;font-size:23px;line-height:1.25;font-weight:700}
.rbtns{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}
.rbtns button{height:52px;border-radius:26px;border:0;font-weight:600;font-size:16px;cursor:pointer;padding:0 20px}
.rbtns .go1{background:var(--green);color:#04130a}
.rbtns .go2{background:rgba(255,255,255,.08)}

/* ---------- lock screen ---------- */
.lock{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
.lock .wall{position:absolute;inset:0;background:radial-gradient(120% 70% at 20% 10%,#3b6cf6 0,transparent 55%),radial-gradient(90% 60% at 90% 80%,#16a34a 0,transparent 60%),linear-gradient(#0b1230,#04060d)}
.lock .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 40%,rgba(0,0,0,.35))}
.clock{position:absolute;top:calc(var(--top) + 46px);left:0;right:0;text-align:center;z-index:2;text-shadow:0 2px 20px rgba(0,0,0,.25)}
.clock .d{font-size:21px;font-weight:600;opacity:.9}
.clock .t{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-top:2px}
.notifs{position:absolute;left:12px;right:12px;bottom:calc(110px + var(--bot));display:flex;flex-direction:column;gap:8px;z-index:2}
.nt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:22px;background:rgba(40,40,48,.55);backdrop-filter:blur(26px) saturate(1.4);cursor:pointer;animation:drop .5s ease-out both}
.nt:nth-child(2){animation-delay:.12s}.nt:nth-child(3){animation-delay:.24s}.nt:nth-child(4){animation-delay:.36s}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.97)}}
.nt .pic{position:relative;width:42px;height:42px;flex:none}
.nt .pic .av{width:42px;height:42px}

function load(){
  let s = structuredClone(DEFAULT);
  try{ const raw = localStorage.getItem(KEY); if (raw) s = Object.assign(s, JSON.parse(raw)); }catch(e){}
  /* saves from before a field existed get the default one */
  DEFAULT.chars.forEach(d => {
    const c = s.chars.find(c => c.name === d.name);
    if (!c){ if (d.name === "Joker") s.chars.push(structuredClone(d)); return; }
    NEW_KEYS.forEach(k => { if (c[k] == null) c[k] = structuredClone(d[k]); });
    if (!c.art && !c.avatar) c.art = d.art;
  });
  return s;
}

  try{ localStorage.setItem(KEY, JSON.stringify(S, (k,v)=> typeof v==="string" && v.startsWith("video:") ? "" : v)); }

function portrait(h){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="hsl(${h},50%,32%)"/><stop offset=".55" stop-color="hsl(${h+30},40%,15%)"/><stop offset="1" stop-color="hsl(${h+50},35%,6%)"/></linearGradient><radialGradient id="l" cx=".78" cy=".22" r=".6"><stop offset="0" stop-color="hsl(${h+20},90%,75%)" stop-opacity=".5"/><stop offset="1" stop-color="hsl(${h},90%,60%)" stop-opacity="0"/></radialGradient><linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="hsl(${h},30%,9%)"/><stop offset=".8" stop-color="hsl(${h},30%,14%)"/><stop offset="1" stop-color="hsl(${h+20},70%,60%)"/></linearGradient></defs><rect width="400" height="860" fill="url(#g)"/><rect width="400" height="860" fill="url(#l)"/><g fill="url(#s)"><ellipse cx="205" cy="360" rx="92" ry="112"/><path d="M118 410c10 60 40 92 87 92s77-32 87-92l12 120c70 22 116 70 126 330H-30c10-260 56-308 126-330z"/></g></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

}

function ring(v, size=46){
  const r = size/2 - 4, len = 2*Math.PI*r, f = Math.min(1, Math.abs(v)/100);
  const col = v >= 0 ? "var(--green)" : "var(--red)";
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${len*f} ${len}"/></svg><b style="color:${col}">${signed(v)}</b></div>`;
}

/* The character "talks": the browser reads the line out loud (if voice is on)
   while the captions follow word by word and the image bumps on every word.
   Falls back to timed captions when the browser gives no word timings. */
const EMO = /[\p{Extended_Pictographic}‍️]/gu;
let talkRun = 0;
function pickVoice(g){
  const en = ("speechSynthesis" in window ? speechSynthesis.getVoices() : []).filter(v => /^en[-_]/i.test(v.lang));
  const want = g === "m" ? /daniel|alex|fred|aaron|arthur|oliver|rishi|tom\b|david|mark|guy|\bmale\b/i
                         : /samantha|ava|allison|susan|victoria|karen|moira|tessa|serena|zira|jenny|aria|female|google us english/i;
  return en.find(v => want.test(v.name)) || en[0] || null;
}
function hush(){ talkRun++; try{ speechSynthesis.cancel(); }catch(e){} }
function talk(text, c, box, stage, done){
  const run = ++talkRun, all = box?.classList.contains("cb");
  const words = String(text||"").split(/\s+/).filter(Boolean);
  let k = -1, timer = 0, synced = false, capsDone = false, voiceDone = true;
  const end = () => { if (run !== talkRun || !capsDone || !voiceDone) return; clearTimeout(timer); done && done(); };
  const show = n => {
    if (run !== talkRun) return;
    k = n;
    const a = all ? 0 : n - n % 3;
    if (box) box.innerHTML = words.slice(a, all ? n+1 : a+3).map((w,j) => `<span class="${a+j===n?"on":""}">${esc(w)}</span>`).join(" ");
    if (stage){ stage.classList.remove("beat"); void stage.offsetWidth; stage.classList.add("beat"); }
  };
  const tick = () => {
    if (run !== talkRun || synced) return;
    if (k+1 >= words.length){ timer = setTimeout(() => { capsDone = true; end(); }, 700); return; }
    show(k+1); timer = setTimeout(tick, 240 + words[k].replace(EMO,"").length * 55);
  };
  if (S.voice !== false && "speechSynthesis" in window && words.length){
    let said = ""; const at = [];
    words.forEach(w => { at.push(said.length); said += w.replace(EMO,"") + " "; });
    const u = new SpeechSynthesisUtterance(said.trim());
    const v = pickVoice(c.voice); if (v) u.voice = v;
    u.lang = v?.lang || "en-US"; u.rate = 1.02; u.pitch = c.voice === "m" ? .9 : 1.1;
    voiceDone = false;
    const safety = setTimeout(() => { voiceDone = true; end(); }, 4000 + said.length * 120);
    u.onboundary = e => {
      if (run !== talkRun || (e.name && e.name !== "word")) return;
      synced = true; clearTimeout(timer);
      let n = 0; while (n+1 < at.length && at[n+1] <= e.charIndex) n++;
      if (n !== k) show(n);
    };
    u.onend = u.onerror = () => {
      clearTimeout(safety); voiceDone = true;
      if (synced){ show(words.length-1); timer = setTimeout(() => { capsDone = true; end(); }, 600); } else end();
    };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  tick();
}

/* ringtone for the incoming call (the browser only lets it play after the first tap) */
let ringCtx = null, ringT = 0;
function startRing(){
  if (ringT || S.voice === false) return;
  try{ ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
  const burst = () => {
    const t = ringCtx.currentTime;
    [440, 480].forEach(f => {
      const o = ringCtx.createOscillator(), g = ringCtx.createGain();
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t+.05); g.gain.setValueAtTime(.07, t+1.9); g.gain.linearRampToValueAtTime(0, t+2);
      o.connect(g).connect(ringCtx.destination); o.start(t); o.stop(t+2.05);
    });
  };
  burst(); ringT = setInterval(burst, 4000);
}
function stopRing(){ clearInterval(ringT); ringT = 0; }

let pickPath = null;

$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f || !pickPath) return;
  let v;
  if (f.type.startsWith("video/")){ v = "video:" + URL.createObjectURL(f); toast("Video added. Uploaded videos aren't kept after a reload; GIFs are."); }
  else if (f.type === "image/gif"){ if (f.size > 3.5e6) toast("Large GIF: it may not be kept after a reload."); v = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); }); }
  else v = await shrink(f);
  setP(S, pickPath, v); save(); render(); renderPanel();
});
function shrink(f){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", .86)); URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });
}

      <div class="sub">Video message · call · comic</div>
      <div class="two"><div class="fld"><label for="va${k}">Your message before the video</label><input id="va${k}" data-bind="chars.${k}.vmAsk" value="${esc(c.vmAsk)}"></div>
      <div class="fld"><label for="vo${k}">Voice</label><select id="vo${k}" data-bind="chars.${k}.voice"><option value="f" ${c.voice!=="m"?"selected":""}>Female</option><option value="m" ${c.voice==="m"?"selected":""}>Male</option></select></div></div>
      <div class="fld"><label for="vm${k}">What they say in the video message</label><textarea id="vm${k}" rows="2" data-bind="chars.${k}.vm">${esc(c.vm)}</textarea></div>
      <div class="fld"><label for="ca${k}">What they say on the call</label><textarea id="ca${k}" rows="2" data-bind="chars.${k}.call">${esc(c.call)}</textarea></div>
      <div class="three">${[0,1,2].map(n=>`<div class="fld"><label for="co${k}${n}">Comic panel ${n+1}</label><input id="co${k}${n}" data-bind="chars.${k}.comic.${n}" value="${esc(c.comic?.[n])}"></div>`).join("")}</div>
      <div class="rowbtns">
        <button type="button" class="btn" data-pick="chars.${k}.avatar">Profile photo</button>
        <button type="button" class="btn" data-pick="chars.${k}.art">Large image / GIF</button>
        ${(c.avatar||c.art)?`<button type="button" class="btn" data-clear="${k}">Remove images</button>`:""}
        ${S.chars.length>1?`<button type="button" class="btn dng" data-del="${k}">Delete</button>`:""}
      </div>
    </div></details>`).join("")}
  <button type="button" class="btn" data-add>+ Add character</button>

  <h3>Conversation with ${esc(c.name)}</h3>
  ${c.messages.map((m,k)=>`<div class="msgrow">
    <select aria-label="Type" data-mtype="${k}">${MTYPES.map(([v,l])=>`<option value="${v}" ${m.t===v?"selected":""}>${l}</option>`).join("")}</select>
    <textarea aria-label="Text" data-bind="chars.${i}.messages.${k}.x" rows="1">${esc(m.x)}</textarea>
    <button type="button" class="x" data-mdel="${k}" aria-label="Delete message">✕</button>
  </div>`).join("")}
  <div class="rowbtns"><button type="button" class="btn" data-madd="them">+ Character</button><button type="button" class="btn" data-madd="me">+ User</button><button type="button" class="btn" data-madd="up">+ Stat up</button><button type="button" class="btn" data-madd="down">+ Stat down</button><button type="button" class="btn" data-madd="narr">+ Narration</button></div>

  <h3>Lock screen</h3>
  <div class="fld"><label for="dt">Date</label><input id="dt" data-bind="date" value="${esc(S.date)}"></div>
  <div class="rowbtns"><button type="button" class="btn" data-pick="wall">Wallpaper</button>${S.wall?`<button type="button" class="btn" data-bgclear="wall">Remove</button>`:""}</div>

  <h3>For recording</h3>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="sbChk" ${S.showBar?"checked":""}> Show status bar (time and battery)</label>
  <div class="three" style="margin-top:8px"><div class="fld"><label for="tm">Time</label><input id="tm" data-bind="time" value="${esc(S.time)}"></div>
  <div class="fld"><label for="bt">Battery</label><input id="bt" type="number" min="1" max="100" data-bind="battery" value="${esc(S.battery)}"></div>
  <div class="fld"><label for="cn">Coins</label><input id="cn" data-bind="coins" value="${esc(S.coins)}"></div></div>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="voiceChk" ${S.voice!==false?"checked":""}> Sound: character voice and ringtone</label>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="camChk" ${S.selfCam?"checked":""}> Show my front camera in the video call</label>
  <div class="fld" style="margin-top:8px"><label for="st">Website on the end screen</label><input id="st" data-bind="site" value="${esc(S.site)}"></div>
  <p class="hint">Record hides these buttons. To bring them back, press H or press and hold the logo or coins for 1.5 seconds.</p>

  <h3>Share a version</h3>
  <p class="hint" style="margin-top:0">Copy the code and have the other person paste it into their Studio. Images are included.</p>
  <div class="rowbtns" style="margin:8px 0"><button type="button" class="btn" data-export>Copy code</button><button type="button" class="btn" data-import>Paste code</button><button type="button" class="btn dng" data-reset>Reset everything</button></div>
  <textarea class="io" id="io" placeholder="Paste another version's code here, then press Paste code"></textarea>`;
  panel.scrollTop = keep;
  document.querySelectorAll(".scr .go").forEach(b => b.classList.toggle("on", b.dataset.screen===route()));
}
panel.addEventListener("input", e => { const b = e.target.dataset.bind; if (!b) return; setP(S, b, e.target.value); save(); render(); });
panel.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="activeSel"){ S.active=+t.value; actState="run"; save(); render(); renderPanel(); }
  else if (t.id==="sbChk"){ S.showBar=t.checked; save(); render(); }
  else if (t.id==="voiceChk"){ S.voice=t.checked; if (!t.checked){ hush(); stopRing(); } save(); render(); }
  else if (t.id==="camChk"){ S.selfCam=t.checked; save(); }
  else if (t.dataset.mtype!=null){ C().messages[+t.dataset.mtype].t=t.value; save(); render(); renderPanel(); }
  else if (t.dataset.bind) renderPanel();
});
panel.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.close!=null) return setEdit(false);
  if (d.screen){ actState="run"; location.hash = d.screen; return; }
  if (d.copy) return copy(linkFor(d.copy), "Link copied: " + SCREENS.find(s=>s[0]===d.copy)[1]);
  if (d.pick) return pick(d.pick);
  if (d.export!=null){ const j = JSON.stringify(S, (k,v)=> typeof v==="string"&&v.startsWith("video:")?"":v); $("#io").value = j; return copy(j, "Code copied"); }
  if (d.clear!=null){ S.chars[+d.clear].avatar=""; S.chars[+d.clear].art=""; }
  if (d.bgclear) S[d.bgclear]="";
  if (d.del!=null){ S.chars.splice(+d.del,1); S.active=Math.min(S.active,S.chars.length-1); }
  if (d.add!=null){ S.chars.push({name:"New character", bomb:"Everyone is talking about you two 👀", sim:"New Sim", scene:"Where it all starts", players:"12.4K", hue:Math.floor(Math.random()*360), avatar:"", art:"", like:0, mood:"🙂", unread:1, time:"now", notif:"hey. are you free tonight?", chips:["who's asking?","always 😌"], auto:"good. I'll text you the address", action:"I show up without telling anyone", result:"Everyone saw you two leave together 👀", gain:10, voice:"f", vmAsk:"where are you?? 👀", vm:"hey. I can't stop thinking about last night. are you free tonight?", call:"hey, it's me. don't hang up. I need to see you tonight", comic:["are you free tonight?","I can't stop thinking about you","so… yes?"], messages:[{t:"them", x:"hey. are you free tonight?"}]}); S.active=S.chars.length-1; }
  if (d.mdel!=null) C().messages.splice(+d.mdel,1);
  if (d.madd){ const nm = first(C()); C().messages.push({them:{t:"them",x:"New message"}, me:{t:"me",x:"Your reply"}, up:{t:"up",x:nm+" · likeability +5"}, down:{t:"down",x:nm+" · likeability -5"}, narr:{t:"narr",x:nm+" looks at you and smiles"}}[d.madd]); }
  if (d.import!=null){ try{ const n = JSON.parse($("#io").value); if (!n.chars) throw 0; S = Object.assign(structuredClone(DEFAULT), n); toast("Version loaded"); }catch(err){ return toast("That code isn't valid. Copy the full code with Copy code."); } }
  if (d.reset!=null){ if (!d.sure){ d.sure="1"; t.textContent="Press again to confirm"; return; } S = structuredClone(DEFAULT); toast("Everything is back to the example"); }
  save(); render(); renderPanel();
});
function copy(text, msg){
  const fb = () => { const io=$("#io"); if (io){ io.value=text; io.select(); } toast("Select and copy the text in the box"); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg), fb); else fb();
}
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), 2800); }
function setEdit(on){ editing = on; panel.hidden = !on; $("#editBtn").textContent = on ? "Done" : "Edit"; if (!on) actState = "run"; renderPanel(); render(); }
$("#editBtn").addEventListener("click", ()=> setEdit(!editing));
$("#cleanBtn").addEventListener("click", ()=>{ setEdit(false); document.body.classList.add("clean"); toast("Recording mode. Press and hold the logo or coins to bring the buttons back."); });
let lp;
app.addEventListener("pointerdown", e => { if (e.target.closest(".logo,.coins,.clock")) lp = setTimeout(()=>{ if (document.body.classList.contains("studio")) document.body.classList.remove("clean"); else unlockStudio(); }, 1500); });
addEventListener("pointerup", ()=>clearTimeout(lp));
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select,[contenteditable='true'],[contenteditable='plaintext-only']")) return;
  const k = e.key.toLowerCase();
  if (!document.body.classList.contains("studio")) return;
  if (k==="h") document.body.classList.toggle("clean");
  if (k==="e") setEdit(!editing);
  if (e.key==="ArrowDown") step(1);
  if (e.key==="ArrowUp") step(-1);
});
addEventListener("hashchange", ()=>{ actState="run"; closeOver(); stopRing(); render(); });
app.addEventListener("pointerdown", ()=>{ if (ringCtx?.state === "suspended") ringCtx.resume(); });
if ("speechSynthesis" in window) speechSynthesis.getVoices();   /* some browsers load the voice list late */
/* The editor is hidden from regular visitors. It opens with ?studio in the
   link, or by pressing and holding the logo or coins for 1.5 seconds. Once
   opened on a device, that device remembers it until "Exit editor". */
const STUDIO_KEY = "worldsims-studio-editor";
function unlockStudio(){
  document.body.classList.add("studio"); document.body.classList.remove("clean");
  try{ localStorage.setItem(STUDIO_KEY, "1"); }catch(e){}
  toast("Editor unlocked on this device");
}
let studioOn = new URLSearchParams(location.search).has("studio");
try{ studioOn = studioOn || localStorage.getItem(STUDIO_KEY) === "1"; }catch(e){}
if (studioOn) unlockStudio.call(null), document.querySelector(".toast")?.remove();
$("#exitBtn").addEventListener("click", ()=>{
  setEdit(false); document.body.classList.remove("studio");
  try{ localStorage.removeItem(STUDIO_KEY); }catch(e){}
  toast("Editor hidden. Hold the logo or coins for 1.5 seconds to open it again.");
});
render();
probe();
</script>
</body>
</html>
